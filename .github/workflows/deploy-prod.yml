name: Deploy Production

# Branching model (see CLAUDE.md "Branching Model"): production only ever runs
# a release — a v* tag cut on main after a develop → main (or hotfix/*) merge.
# Dispatch it on the tag, not on a branch:
#
#   gh workflow run deploy-prod.yml --ref v<version>
#
# Both jobs check out `github.ref`, i.e. the tag, so the gate validates and
# the deploy builds exactly the tagged commit.
on:
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight (verify CI green on main)
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ancestry check below can see origin/main.
          fetch-depth: 0

      # workflow_dispatch accepts any ref, so refuse a branch, or a tag that
      # never reached main, before anything is built or deployed. This is a
      # failing step rather than a job-level `if:` on purpose: a skipped gate
      # would make the run look like a quiet no-op instead of a refusal.
      - name: Require a release tag on main
        run: |
          set -euo pipefail
          echo "Dispatched on $GITHUB_REF ($GITHUB_SHA)"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Production deploys only from a v* release tag. Re-run with: gh workflow run deploy-prod.yml --ref v<version>"
              exit 1 ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA, which is not on main. Tag the release commit on main."
            exit 1
          fi
          echo "ok: ${GITHUB_REF#refs/tags/} is on main"

      # Don't ship a known-broken release. The tag points at main's release
      # merge commit, on which CI ran; refuse to deploy if it didn't succeed. This costs a few
      # seconds and prevents the "I clicked the button without checking" foot-gun.
      - name: Verify CI Pass on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              check_name: 'CI Pass',
            });
            const ciPass = checkRuns.check_runs[0];
            if (!ciPass) {
              core.setFailed(`No CI Pass check found for ${sha}. CI must have run on this release commit on main.`);
              return;
            }
            if (ciPass.conclusion !== 'success') {
              core.setFailed(`CI Pass conclusion was '${ciPass.conclusion}' for ${sha}. Refusing to deploy.`);
              return;
            }
            console.log(`CI Pass green on ${sha} — proceeding.`);

  deploy:
    name: Deploy to Production
    # The gate above must succeed (release tag on main + CI Pass) first.
    needs: [preflight]
    runs-on: ubuntu-latest
    # GitHub deployment environment "production" — adds a protection
    # surface (required reviewers, wait timers) configurable in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # See deploy-dev.yml for why this step exists. Same root cause:
      # [assets] directory = "./build" must exist before wrangler deploy.
      - name: Build SPA assets
        working-directory: apps/web
        run: pnpm run build:assets

      # Required scopes on CLOUDFLARE_API_TOKEN (repo secret):
      #   Account → Workers Scripts → Edit
      #   Account → D1 → Edit
      #   Account → Workers Tail → Read
      - name: Deploy to Cloudflare Workers (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          environment: production
